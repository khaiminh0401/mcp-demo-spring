server:
  port: 8081

spring:
  application:
    name: flight-mcp-server
  ai:
    mcp:
      server:
        name: flight-mcp-server
        version: 1.0.0
        type: SYNC
        sse-endpoint: /sse
        sse-message-endpoint: /mcp/message

management:
  endpoints:
    web:
      exposure:
        include: health,info
