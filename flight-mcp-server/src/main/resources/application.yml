server:
  port: 8081

spring:
  application:
    name: flight-mcp-server
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/flight/flightdb;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  sql:
    init:
      mode: always
  ai:
    mcp:
      server:
        name: flight-mcp-server
        version: 1.0.0
        type: SYNC
        sse-endpoint: /sse
        sse-message-endpoint: /mcp/message

management:
  endpoints:
    web:
      exposure:
        include: health,info
