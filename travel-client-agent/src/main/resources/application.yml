server:
  port: 8080

spring:
  application:
    name: travel-client-agent
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
            temperature: 0.2
            include-thoughts: true
    mcp:
      client:
        enabled: true
        name: travel-client-agent
        version: 1.0.0
        initialized: true
        request-timeout: 30s
        type: SYNC
        toolcallback:
          enabled: true
        sse:
          connections:
            flight:
              url: ${FLIGHT_MCP_URL:http://localhost:8081}
              sse-endpoint: /sse
            hotel:
              url: ${HOTEL_MCP_URL:http://localhost:8082}
              sse-endpoint: /sse
            cab:
              url: ${CAB_MCP_URL:http://localhost:8083}
              sse-endpoint: /sse

management.endpoints.web.exposure.include: health,info
